name: Publish SQR update

# Runs when Claude (or anyone) pushes a new data/sqr/latest.json to main,
# or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths: ['data/sqr/latest.json']
  workflow_dispatch:

concurrency:
  group: publish-sqr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --prefix tools --no-audit --no-fund @supabase/supabase-js@2.45.4
      - name: Publish to Supabase
        run: node tools/sqr.cjs publish data/sqr/latest.json
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
